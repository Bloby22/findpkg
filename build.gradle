plugins {
    id 'java'
    id 'application'
}

group = 'dev.findpkg'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dev.findpkg.Main'
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': 'findpkg',
            'Implementation-Version': project.version
        )
    }

    archiveBaseName = 'findpkg'
}
